# Container names are prefixed with CLUSTER_NAME (default "rocoto", set in
# docker/.env) so a second instance can be started alongside this one without
# name collisions, e.g.:
#   CLUSTER_NAME=rocoto-slurm2 docker compose -p rocoto-slurm2 -f docker-compose.yml up -d

# Common configuration shared by all compute nodes. Individual node services
# merge this with `<<: *node-common` and then override the bits that differ
# (container_name, hostname, environment).
x-node-common: &node-common
  image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-node:ubuntu-${UBUNTU_VERSION:-26.04}-slurm-${SLURM_VERSION:-25.11.5}
  shm_size: '4g'
  user: admin
  volumes:
    - home-vol:/home/admin
    - opt-vol:/opt:ro
    - ..:/home/admin/rocoto
  depends_on:
    slurmmaster:
      condition: service_started
    slurmfrontend:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "ssh", "-o", "StrictHostKeyChecking=no", "admin@localhost", "hostname"]
    interval: 2s
    timeout: 2s
    retries: 10
    start_period: 5s

services:
  slurmfrontend:
    image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-frontend:ubuntu-${UBUNTU_VERSION:-26.04}-slurm-${SLURM_VERSION:-25.11.5}
    container_name: ${CLUSTER_NAME:-rocoto}-frontend
    shm_size: '4g'
    hostname: slurmfrontend
    user: admin
    volumes:
      - home-vol:/home/admin
      - opt-vol:/opt
      - ..:/home/admin/rocoto
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ssh-ready"]
      interval: 5s
      timeout: 2s
      retries: 250
      start_period: 60s

  slurmmaster:
    image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-master:ubuntu-${UBUNTU_VERSION:-26.04}-slurm-${SLURM_VERSION:-25.11.5}
    container_name: ${CLUSTER_NAME:-rocoto}-master
    shm_size: '4g'
    hostname: slurmmaster
    user: admin
    volumes:
      - home-vol:/home/admin
      - opt-vol:/opt:ro
      - ..:/home/admin/rocoto
    environment:
      - SLURM_CPUS_ON_NODE=8
    depends_on:
      slurmfrontend:
        condition: service_healthy

  slurmnode1:
    <<: *node-common
    container_name: ${CLUSTER_NAME:-rocoto}-node1
    hostname: slurmnode1
    environment:
      - SLURM_NODENAME=slurmnode1
      - SLURM_CPUS_ON_NODE=8

  slurmnode2:
    <<: *node-common
    container_name: ${CLUSTER_NAME:-rocoto}-node2
    hostname: slurmnode2
    environment:
      - SLURM_NODENAME=slurmnode2
      - SLURM_CPUS_ON_NODE=8

  slurmnode3:
    <<: *node-common
    container_name: ${CLUSTER_NAME:-rocoto}-node3
    hostname: slurmnode3
    environment:
      - SLURM_NODENAME=slurmnode3
      - SLURM_CPUS_ON_NODE=8

  slurmnode4:
    <<: *node-common
    container_name: ${CLUSTER_NAME:-rocoto}-node4
    hostname: slurmnode4
    environment:
      - SLURM_NODENAME=slurmnode4
      - SLURM_CPUS_ON_NODE=8

  slurmnode5:
    <<: *node-common
    container_name: ${CLUSTER_NAME:-rocoto}-node5
    hostname: slurmnode5
    environment:
      - SLURM_NODENAME=slurmnode5
      - SLURM_CPUS_ON_NODE=8

volumes:
  home-vol:
  opt-vol:
